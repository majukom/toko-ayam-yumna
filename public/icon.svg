<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin for maskable icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Golden Ring Accent -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="#065f46" stroke="#fbbf24" stroke-width="4"/>

  <!-- Stylized Chicken / Rooster Silhouette in warm gold -->
  <g filter="url(#shadow)">
    <!-- Rooster comb (jengger) in bright warm amber -->
    <path d="M 230 145 C 220 130 205 135 210 152 C 200 145 185 155 192 170 C 180 170 175 185 190 195 Z" fill="#ef4444" />
    
    <!-- Rooster body and head -->
    <path d="M 200 185 
             C 240 160 280 180 295 210 
             C 310 240 315 280 290 320 
             C 275 340 250 355 220 355 
             C 175 355 150 325 150 285 
             C 150 250 170 215 200 185 Z" fill="url(#goldGrad)" />
    
    <!-- Rooster beak -->
    <polygon points="175,198 150,205 174,215" fill="#f59e0b" />
    
    <!-- Rooster wattle (pial) -->
    <path d="M 180 220 C 175 235 185 245 195 235 Z" fill="#dc2626" />

    <!-- Rooster eye -->
    <circle cx="195" cy="198" r="4.5" fill="#1e293b" />

    <!-- Wing details (fresh clean butcher cut curves) -->
    <path d="M 230 235 C 270 240 285 270 270 305 C 255 315 230 295 225 270 Z" fill="#d97706" opacity="0.85" />
    <path d="M 280 235 C 335 225 355 255 340 295 C 325 285 305 275 285 275 Z" fill="#b45309" opacity="0.75" />

    <!-- Fresh egg at the side -->
    <ellipse cx="320" cy="330" rx="30" ry="38" transform="rotate(18 320 330)" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" />
    <ellipse cx="316" cy="324" rx="22" ry="28" transform="rotate(18 316 324)" fill="#fffbeb" opacity="0.6" />
  </g>

  <!-- Banner text / Brand initials -->
  <rect x="136" y="375" width="240" height="42" rx="21" fill="url(#goldGrad)" />
  <text x="256" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="2">YUMNA SEGAR</text>
</svg>
